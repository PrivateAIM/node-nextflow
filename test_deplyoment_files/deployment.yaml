# ========================
# RBAC for Nextflow jobs
# ========================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextflow-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: nextflow-role
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/status", "pods/log", "services", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextflow-sa-binding
subjects:
  - kind: ServiceAccount
    name: nextflow-sa
    namespace: default
roleRef:
  kind: Role
  name: nextflow-role
  apiGroup: rbac.authorization.k8s.io
---
# ========================
# Nextflow config (K8s executor + MinIO S3)
# ========================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextflow-config
  namespace: default
data:
  nextflow.config: |
    plugins {
      id 'nf-k8s'
    }

    executor {
      name = 'k8s'
    }


    k8s {
      namespace = 'default'
      serviceAccount = 'nextflow-sa'
      launchDir = '/tmp/nextflow/launch'
      pod = [
        [env: 'AWS_ACCESS_KEY_ID',     secret: 'minio-credentials', secretKey: 'AWS_ACCESS_KEY_ID'],
        [env: 'AWS_SECRET_ACCESS_KEY', secret: 'minio-credentials', secretKey: 'AWS_SECRET_ACCESS_KEY'],
      ]
    }

    aws {
      accessKey = System.env.AWS_ACCESS_KEY_ID
      secretKey = System.env.AWS_SECRET_ACCESS_KEY
      client {
        endpoint          = 'http://flame-node-minio:9000'
        s3PathStyleAccess = true
        signerOverride    = 'S3SignerType'
      }
    }

    // Cap worker pod resources so they fit on minikube
    executor {
      queueSize = 2
    }

    process {
      resourceLimits = [
        cpus: 1,
        memory: '2.GB'
      ]
    }

    env {
      NXF_HOME = '/tmp/.nextflow'
      AWS_ACCESS_KEY_ID = System.env.AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY = System.env.AWS_SECRET_ACCESS_KEY
    }
---
# ========================
# Nextflow Launcher API
# ========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextflow-deployment
  labels:
    app: nextflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextflow
  template:
    metadata:
      labels:
        app: nextflow
    spec:
      serviceAccountName: nextflow-sa
      containers:
      - name: nextflow
        image: nextflow-api:latest
        imagePullPolicy: Never
        env:
          - name: POSTGRES_HOST
            value: "flame-node-postgresql"
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgres-credentials-secret
                key: DB_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-credentials-secret
                key: DB_PASSWORD
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: postgres-credentials-secret
                key: DB_DATABASE
          - name: KEYCLOAK_URL
            value: "http://flame-node-keycloak-http:80/keycloak"
          - name: NF_MINIO_BUCKET
            value: "flame"
          - name: NF_MINIO_PREFIX
            value: "Nextflow"
          - name: NF_MINIO_SECRET
            value: "minio-credentials"
          - name: WEBHOOK_URL
            value: "http://nextflow-service:8000"
          # Kong's auth plugin matches/strips KONG_MINIO_PATH_PREFIX before
          # forwarding to MinIO upstream. Sign against BASE_URL only; the
          # prefix is added unsigned, so MinIO sees a canonical request that
          # matches the SigV4 signature.
          - name: KONG_MINIO_BASE_URL
            value: "https://kong.example.org"          # TODO: set to actual Kong host
          - name: KONG_MINIO_PATH_PREFIX
            value: "/minio"                            # TODO: empty if Kong does not strip a prefix
          - name: KONG_PRESIGN_TTL_SECONDS
            value: "86400"
          - name: INTERNAL_MINIO_ENDPOINT
            value: "http://flame-node-minio:9000"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: AWS_SECRET_ACCESS_KEY
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: nextflow-service
spec:
  type: NodePort
  selector:
    app: nextflow
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
    nodePort: 30080
