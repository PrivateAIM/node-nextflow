apiVersion: v1
kind: ServiceAccount
metadata:
  name: nf-api-sa
  namespace: default

---
# RBAC so the API can create/list Jobs and inspect Pods/logs/events if needed
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nf-api-role
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create","get","list","watch","delete"]
  - apiGroups: [""]
    resources: ["pods","pods/log","events","configmaps"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments","replicasets"]
    verbs: ["get","list","watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nf-api-rb
  namespace: default
subjects:
  - kind: ServiceAccount
    name: nf-api-sa
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nf-api-role

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextflow-launcher
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextflow-launcher
  template:
    metadata:
      labels:
        app: nextflow-launcher
    spec:
      serviceAccountName: nf-api-sa
      containers:
        - name: api
          image: nexflow-launcher:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 200
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 100
            periodSeconds: 10
          env:
            - name: NF_NAMESPACE
              value: "nextflow"
            - name: NF_SERVICE_ACCOUNT
              value: "nextflow-sa"        # the SA used by Job pods (your working SA)
            - name: NF_IMAGE
              value: "nextflow/nextflow:24.10.0"
            - name: NF_CONFIGMAP
              value: "nextflow-config"
            - name: NF_CONFIGMAP_KEY
              value: "nextflow.config"
            - name: NF_CONF_MOUNT
              value: "/conf"
            - name: NF_BACKOFF_LIMIT
              value: "0"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                    name: minio-credentials
                    key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                    name: minio-credentials
                    key: secret-key

---
apiVersion: v1
kind: Service
metadata:
  name: nextflow-launcher
  namespace: default
spec:
  selector:
    app: nextflow-launcher
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP

---
# Optional: only allow traffic from same namespace (or add your API namespaces)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: nextflow-launcher
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}  # any pod in same namespace
      ports:
        - port: 80
